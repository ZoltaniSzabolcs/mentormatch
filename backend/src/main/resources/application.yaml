spring:
  application:
    name: mentor-match
  datasource:
    url: jdbc:postgresql://localhost:5432/mentormatch
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        sql: true
        format_sql: true
    hibernate:
      ddl-auto: update #to run the seeder again change this to 'create' and after the first run switch it back to update
    open-in-view: false
logging:
  level:
    org.hibernate.sql: debug
#    org.hibernate.orm.jdbc.bind: trace
server:
  port: 8081

# application specific properties
pagination:
  page-size: 10
jwt:
  secret: 833152120af0c8ec782f305853993c4dee763222474600133c9c080688ebc13c
access:
  token:
    lifetime: 3600000 # 1 hour in milliseconds
